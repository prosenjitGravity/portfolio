<header class="header" [class.header-scrolled]="isScrolled">
  <div class="container"><nav class="navbar" aria-label="Main navigation">
    <a href="#home" class="brand" (click)="navigateTo('home', $event)"><span class="brand-name">Prosenjit Paul</span><span class="brand-role">Full-Stack Developer</span></a>
    <div class="nav-shell" [class.active]="isMenuOpen">
      <ul class="menu-items">
        <li class="menu-item" *ngFor="let item of navItems" [class.active]="activeSectionId() === item.id">
          <a [href]="'#' + item.id" (click)="navigateTo(item.id, $event)">{{ item.label }}</a>
        </li>
        <li class="menu-item macos-desktop-toggle">
          <a href="#" (click)="goToDesktop($event)">
            <i class="fas fa-laptop-code"></i> macOS Desktop
          </a>
        </li>
      </ul>
      <a href="#contact" class="nav-cta" (click)="navigateTo('contact', $event)">Start a conversation</a>
    </div>
    <button type="button" class="mobile-toggle" [class.active]="isMenuOpen" aria-label="Toggle menu" (click)="toggleMenu()"><span></span><span></span><span></span></button>
  </nav></div>
</header>
