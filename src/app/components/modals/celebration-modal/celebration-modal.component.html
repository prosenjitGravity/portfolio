<div 
      *ngIf="celebrationData.isVisible" 
      class="celebration-overlay"
      [@modalAnimation]="celebrationData.isVisible ? 'open' : 'closed'"
      (click)="onBackdropClick($event)">
      
      <!-- Animated Background -->
      <div class="animated-background">
        <div class="mesh-layer mesh-1"></div>
        <div class="mesh-layer mesh-2"></div>
        <div class="mesh-layer mesh-3"></div>
      </div>

      <!-- Backdrop -->
      <div class="backdrop"></div>

      <!-- Ripple Effects -->
      <div class="ripple-container">
        <div 
          *ngFor="let ripple of ripples" 
          class="ripple"
          [style.left.px]="ripple.x - ripple.time * 5"
          [style.top.px]="ripple.y - ripple.time * 5"
          [style.width.px]="ripple.time * 10"
          [style.height.px]="ripple.time * 10"
          [style.opacity]="Math.max(0, 1 - ripple.time / 100)"
          [style.transform]="'scale(' + (ripple.time / 20) + ')'">
        </div>
      </div>

      <!-- Floating Shapes -->
      <div class="floating-shapes-container">
        <div 
          *ngFor="let shape of floatingShapes"
          class="floating-shape"
          [class]="'shape-' + shape.type"
          [style.left.px]="shape.x"
          [style.top.px]="shape.y"
          [style.width.px]="shape.size"
          [style.height.px]="shape.size"
          [style.opacity]="shape.opacity"
          [style.border-color]="shape.color"
          [style.background]="getShapeBackground(shape)">
        </div>
      </div>

      <!-- Advanced Particles -->
      <div class="particles-container">
        <div 
          *ngFor="let particle of particles"
          class="particle"
          [class]="'particle-' + particle.type"
          [style.left.px]="particle.x"
          [style.top.px]="particle.y"
          [style.transform]="'rotate(' + particle.rotation + 'deg) scale(' + particle.life + ')'"
          [style.opacity]="particle.life">
          <div 
            class="particle-icon"
            [style.width.px]="particle.size"
            [style.height.px]="particle.size"
            [style.color]="particle.color"
            [style.filter]="'drop-shadow(0 0 ' + (particle.size / 2) + 'px ' + particle.color + ')'">
            {{ getParticleIcon(particle.type) }}
          </div>
        </div>
      </div>

      <!-- Light Rays -->
      <div class="light-rays">
        <div class="light-ray light-ray-1"></div>
        <div class="light-ray light-ray-2"></div>
        <div class="light-ray light-ray-3"></div>
      </div>

      <!-- Modal Content -->
      <div 
        class="modal-content"
        [@contentAnimation]="showContent ? 'visible' : 'hidden'"
        (click)="$event.stopPropagation()">
        
        <div class="modal-card">
          <!-- Background Patterns -->
          <div class="background-patterns">
            <div class="pattern pattern-1"></div>
            <div class="pattern pattern-2"></div>
          </div>

          <!-- Floating Decorations -->
          <div class="decorations">
            <!-- <div class="decoration decoration-1">✨</div> -->
            <!-- <div class="decoration decoration-2">📈</div> -->
            <!-- <div class="decoration decoration-3">⭐</div> -->
            <!-- <div class="decoration decoration-4">💎</div> -->
          </div>

          <!-- Close Button -->
          <button class="close-button" (click)="closeCelebration()">
            ✕
          </button>

          <!-- Success Icon -->
          <div class="success-icon-container">
            <div class="success-icon">
              <div class="checkmark">✓</div>
            </div>
            <div class="success-pulse pulse-1"></div>
            <div class="success-pulse pulse-2"></div>
            <div class="success-pulse pulse-3"></div>
          </div>

          <!-- Success Message -->
          <div class="message-container">
            <div >🎉<span class="title">Transaction Successful!</span> 🎉</div>
            
            <div class="amount-container">
              <p class="amount">{{ formatAmount(celebrationData.amount) }}</p>
              <p class="message">{{ celebrationData.message }}</p>
            </div>

            <div class="status-container">
              <span class="sparkle">✨</span>
              <span class="status-text">Processing completed successfully</span>
              <span class="sparkle">✨</span>
            </div>
          </div>

          <!-- Action Button -->
          <button class="continue-button" (click)="onBackdropClick($event)">
            Continue
          </button>
        </div>
      </div>
    </div>
