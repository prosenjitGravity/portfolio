<section id="projects" class="portfolio">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Projects</span>
      <h2 class="section-title">Selected work, built around real operational needs.</h2>
      <p class="section-subtitle">
        A focused selection of projects that demonstrate backend design, real-time workflows, and user-facing delivery.
      </p>
    </div>

    <div class="portfolio-grid">
      <article class="project-card glass-card" *ngFor="let project of filteredProjects">
        <div class="project-top">
          <i class="far fa-folder folder"></i>
          <div class="project-links">
            <a [href]="project.github" target="_blank" rel="noreferrer" [attr.aria-label]="'Open ' + project.title + ' repository'"><i class="fab fa-github"></i></a>
          </div>
        </div>

        <div class="project-content">
          <div class="project-meta">
            <span class="project-badge">{{ project.categoryLabel }}</span>
            <span class="project-metric">{{ project.metrics }}</span>
          </div>
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-desc">{{ project.description }}</p>
        </div>

        <div class="pill-list">
          <span class="pill" *ngFor="let tech of project.technologies">
            <i [class]="getTechIcon(tech)" [class.tech-icon]="true" [ngClass]="getTechColorClass(tech)"></i>
            {{ tech }}
          </span>
        </div>

        <div class="project-action-footer" *ngIf="project.id === 1">
          <button class="launch-desktop-action-btn" (click)="onProjectAction(project)">
            <i class="fas fa-desktop"></i> Launch macOS Layout
          </button>
        </div>
      </article>
    </div>
  </div>
</section>
