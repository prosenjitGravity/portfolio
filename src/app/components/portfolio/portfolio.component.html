<section id="projects" class="portfolio">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Projects</span>
      <h2 class="section-title">Key Featured Projects</h2>
      <p class="section-subtitle">
        These projects demonstrate real-world systems, concurrency handling, database optimizations, and interface designs.
      </p>
    </div>

    <div class="portfolio-grid">
      <article class="project-card glass-card" *ngFor="let project of filteredProjects">
        <div class="project-top">
          <i class="far fa-folder folder"></i>
          <div class="project-links">
            <a [href]="project.github" target="_blank" aria-label="GitHub Repository"><i class="fab fa-github"></i></a>
          </div>
        </div>

        <div class="project-content">
          <div class="project-meta">
            <span class="project-badge">{{ project.categoryLabel }}</span>
            <span class="project-metric">{{ project.metrics }}</span>
          </div>
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-desc">{{ project.description }}</p>
        </div>

        <div class="pill-list">
          <span class="pill" *ngFor="let tech of project.technologies">{{ tech }}</span>
        </div>
      </article>
    </div>
  </div>
</section>
