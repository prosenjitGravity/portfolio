<section id="services" class="services">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Skills</span>
      <h2 class="section-title">Technical depth across the product lifecycle.</h2>
      <p class="section-subtitle">
        A working toolkit for backend services, user-facing applications, deployment pipelines, and data-intensive systems.
      </p>
    </div>

    <div class="skills-matrix">
      <div class="matrix-card glass-card" *ngFor="let group of skillGroups">
        <h3>
          <i [class]="group.icon"></i>
          {{ group.title }}
        </h3>
        <div class="tag-container">
          <span
            class="pill"
            *ngFor="let skill of group.skills"
            [class.highlight]="skill.highlight">
            <i *ngIf="skill.icon" [class]="skill.icon" class="skill-icon"></i>
            {{ skill.name }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
